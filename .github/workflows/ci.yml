name: CI

on:
  push:
  pull_request:

jobs:
  db:
    name: Migrações e testes SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pw
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar migrações, seeds e testes
        run: |
          for f in supabase/migrations/*.sql supabase/seed/*.sql supabase/tests/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

  collector:
    name: Coletor (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pw
      DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Banco com migrações e seeds
        run: |
          for f in supabase/migrations/*.sql supabase/seed/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - working-directory: collector
        run: pip install -e ".[dev]"
      - working-directory: collector
        run: pytest -q

  bot:
    name: Bot (TypeScript)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pw
      DATABASE_URL: postgresql://postgres:pw@localhost:5432/postgres
      DATABASE_URL_BOT: postgresql://gm_bot:pw@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Banco com migrações e seeds
        run: |
          for f in supabase/migrations/*.sql supabase/seed/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql -qc "alter role gm_bot login password 'pw'"
      - working-directory: bot
        run: npm ci
      - working-directory: bot
        run: npm run typecheck
      - working-directory: bot
        run: npm test
