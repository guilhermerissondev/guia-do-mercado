# Redes de supermercado candidatas à coleta de preço base.
#
# Esta lista é só o ponto de partida: `python -m gm.ferramentas.mapear_redes` confere cada rede
# (o site responde? qual plataforma? o robots.txt permite? em quais regiões entrega?) e grava o
# resultado em catalogo/mapa_redes.json. Só entram na coleta as redes marcadas como viáveis lá.
#
#   id       : identificador interno
#   nome     : nome público
#   dominios : endereços a tentar, em ordem (o primeiro que responder é usado)
#   ufs      : estados onde a rede atua (limita os testes e o agendamento da coleta)
#   excluida : motivo, se a rede não deve ser coletada (decisão do dono do produto ou bloqueio)

# ---------------------------------------------------------------- nacionais / multirregionais

