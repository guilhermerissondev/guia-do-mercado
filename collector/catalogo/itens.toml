# Catálogo canônico nacional do Guia do Mercado.
#
# Cada item é genérico (sem marca) e tem tamanho de embalagem fixo: é o que o
# usuário põe na lista ("leite integral 1 L"). As faixas econômico/típico/premium
# saem das marcas diferentes que casam com o mesmo item.
#
# Regras de casamento (aplicadas ao nome normalizado: minúsculas, sem acento):
#   termos   : todos precisam aparecer (palavra ou expressão inteira)
#   algum    : pelo menos um precisa aparecer (opcional)
#   excluir  : nenhum pode aparecer
#   comeca_com : o nome do produto precisa começar por uma destas expressões (evita
#                "salgadinho sabor cebola" casar com cebola); obrigatório para granel
#   conteudo : tamanho da embalagem ("1l", "500g", "12un"); omitido com granel = true
#   granel   : vendido por kg; o preço é normalizado para 1 kg. Aceita produto sem tamanho
#              ou com tamanho em kg (caixa de atacado de 19 kg vira preço por kg)
#   permite_unidades : aceita "c/10" junto do tamanho (ex.: saco de lixo 50 L com 10 un);
#                      sem isso, tamanho + contagem > 1 é tratado como pacote múltiplo e rejeitado
#
# Para incluir um item, copie um parecido e ajuste. Rode os testes do coletor depois.

